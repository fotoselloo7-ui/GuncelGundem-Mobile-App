name: Cleanup Stuck iPad Screenshots

on:
  workflow_dispatch:
    inputs:
      confirm_delete:
        description: 'Delete all iPad screenshot sets from App Store version 1.0'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cleanup:
    if: ${{ inputs.confirm_delete }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JWT dependency
        run: python -m pip install --disable-pip-version-check "PyJWT[crypto]==2.10.1"

      - name: Delete iPad screenshot sets
        env:
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          import jwt

          BASE = "https://api.appstoreconnect.apple.com"
          BUNDLE_ID = "tr.guncelgundem.app"
          STORE_VERSION = "1.0"
          PLATFORM = "IOS"

          key_id = os.environ["API_KEY_ID"]
          issuer_id = os.environ["API_ISSUER_ID"]
          private_key = os.environ["API_PRIVATE_KEY"]

          now = int(time.time())
          token = jwt.encode(
              {
                  "iss": issuer_id,
                  "iat": now,
                  "exp": now + 600,
                  "aud": "appstoreconnect-v1",
              },
              private_key,
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          )

          def api(method, path, params=None):
              url = BASE + path
              if params:
                  url += "?" + urllib.parse.urlencode(params, doseq=True)
              request = urllib.request.Request(
                  url,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read().decode("utf-8")
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(
                      f"App Store Connect API error: {method} {path} -> "
                      f"HTTP {exc.code}\n{body}"
                  )

          _, apps = api(
              "GET",
              "/v1/apps",
              {"filter[bundleId]": BUNDLE_ID, "limit": 10},
          )
          if len(apps.get("data", [])) != 1:
              raise SystemExit(
                  f"Expected exactly one app for {BUNDLE_ID}, found "
                  f"{len(apps.get('data', []))}."
              )
          app = apps["data"][0]
          print(f"App: {app['id']} ({BUNDLE_ID})")

          _, versions = api(
              "GET",
              f"/v1/apps/{app['id']}/appStoreVersions",
              {
                  "filter[versionString]": STORE_VERSION,
                  "filter[platform]": PLATFORM,
                  "limit": 50,
              },
          )
          candidates = versions.get("data", [])
          if len(candidates) != 1:
              states = [
                  (v.get("id"), v.get("attributes", {}).get("appVersionState"))
                  for v in candidates
              ]
              raise SystemExit(
                  f"Expected exactly one iOS App Store version {STORE_VERSION}; "
                  f"found {len(candidates)}: {states}"
              )
          version = candidates[0]
          print(
              f"App Store version: {version['id']} "
              f"({STORE_VERSION}, {version.get('attributes', {}).get('appVersionState')})"
          )

          _, localizations = api(
              "GET",
              f"/v1/appStoreVersions/{version['id']}/appStoreVersionLocalizations",
              {"limit": 200},
          )

          ipad_sets = []
          for localization in localizations.get("data", []):
              locale = localization.get("attributes", {}).get("locale", "unknown")
              _, sets = api(
                  "GET",
                  f"/v1/appStoreVersionLocalizations/{localization['id']}/appScreenshotSets",
                  {
                      "fields[appScreenshotSets]": "screenshotDisplayType",
                      "limit": 200,
                  },
              )
              for screenshot_set in sets.get("data", []):
                  display_type = screenshot_set.get("attributes", {}).get(
                      "screenshotDisplayType", ""
                  )
                  if display_type.startswith("APP_IPAD_"):
                      ipad_sets.append(
                          (screenshot_set["id"], locale, display_type)
                      )

          if not ipad_sets:
              print("No iPad screenshot sets found. Nothing to delete.")
              raise SystemExit(0)

          print("iPad screenshot sets to delete:")
          for set_id, locale, display_type in ipad_sets:
              print(f"  {locale}: {display_type} -> {set_id}")

          for set_id, locale, display_type in ipad_sets:
              status, _ = api("DELETE", f"/v1/appScreenshotSets/{set_id}")
              if status != 204:
                  raise SystemExit(
                      f"Unexpected delete status {status} for {set_id}"
                  )
              print(f"Deleted {locale} {display_type}: {set_id}")

          print(f"Done. Deleted {len(ipad_sets)} iPad screenshot set(s).")
          print("iPhone screenshot sets were not touched.")
          PY
