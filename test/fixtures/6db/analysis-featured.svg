<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="anaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#anaBg)"/>
  <!-- Macroeconomic chart lines and candlestick bars -->
  <g opacity="0.3" stroke="#64748B" stroke-width="1">
    <line x1="40" y1="60" x2="560" y2="60"/>
    <line x1="40" y1="130" x2="560" y2="130"/>
    <line x1="40" y1="200" x2="560" y2="200"/>
    <line x1="40" y1="270" x2="560" y2="270"/>
  </g>
  <!-- Bars -->
  <g fill="#0284C7" opacity="0.4">
    <rect x="80" y="160" width="24" height="110" rx="4"/>
    <rect x="140" y="120" width="24" height="150" rx="4"/>
    <rect x="200" y="90" width="24" height="180" rx="4"/>
    <rect x="260" y="140" width="24" height="130" rx="4"/>
    <rect x="320" y="80" width="24" height="190" rx="4"/>
    <rect x="380" y="110" width="24" height="160" rx="4"/>
    <rect x="440" y="60" width="24" height="210" rx="4"/>
  </g>
  <!-- Trend line with glow -->
  <polyline points="92,150 152,110 212,80 272,130 332,70 392,100 452,50" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="452" cy="50" r="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="3"/>
  <text x="300" y="325" font-family="sans-serif" font-size="14" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1">KÜRESEL MAKRO EKONOMİ VE PİYASA MODELLERİ</text>
</svg>