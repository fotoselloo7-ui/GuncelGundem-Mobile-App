workflows:
  ios-testflight:
    name: Güncel Gündem iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "GuncelGundem GitHub CI"

    environment:
      flutter: 3.47.4
      xcode: latest
      vars:
        BUNDLE_ID: "tr.guncelgundem.app"

    scripts:
      - name: Enable Flutter Swift Package Manager
        script: |
          flutter config --enable-swift-package-manager

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Initialize signing keychain
        script: |
          keychain initialize

      - name: Fetch or create Apple signing files
        script: |
          set -euo pipefail
          CERT_KEY="$CM_BUILD_DIR/ios_distribution_private_key"
          openssl genrsa -out "$CERT_KEY" 2048
          chmod 600 "$CERT_KEY"

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key "@file:$CERT_KEY"

      - name: Add signing certificate to keychain
        script: |
          keychain add-certificates

      - name: Apply iOS provisioning profile
        script: |
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=5 \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
