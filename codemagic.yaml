workflows:
  ios-testflight:
    name: Güncel Gündem iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: GuncelGundem GitHub CI

    environment:
      flutter: 3.47.4
      xcode: latest
      vars:
        BUNDLE_ID: tr.guncelgundem.app

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Set up iOS code signing
        script: |
          set -e
          keychain initialize
          openssl genrsa -out "$CM_BUILD_DIR/ios_distribution_private_key" 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key "@file:$CM_BUILD_DIR/ios_distribution_private_key"
          keychain add-certificates
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=5 \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
