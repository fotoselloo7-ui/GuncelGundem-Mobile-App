workflows:
  ios-testflight:
    name: Güncel Gündem iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "GuncelGundem GitHub CI"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: tr.guncelgundem.app
      flutter: 3.47.4
      xcode: latest

    scripts:
      - name: Enable Flutter Swift Package Manager
        script: |
          flutter config --enable-swift-package-manager

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Apply iOS signing profiles
        script: |
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=5 \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
